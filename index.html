  <script>
    // Aplica o tema antes de renderizar (evita "piscar")
    (function(){
      try{
        var s=JSON.parse(localStorage.getItem('fin_settings')||'{}');
        var t=s.theme||'system';
        if(t==='system')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
        document.documentElement.dataset.theme=t;
        if(s.hideValues)document.documentElement.classList.add('privacy-pre');
      }catch(e){document.documentElement.dataset.theme='light';}
    })();
  </script>

<!-- ═══════════ LOGIN ═══════════ -->
<div class="auth-screen" id="auth">
  <form class="auth-card" id="auth-form" autocomplete="on">
    <div class="auth-logo"><svg class="i"><use href="#i-logo"/></svg></div>
    <h1>Fin</h1>
    <p class="sub">Acesse sua conta para continuar</p>
    <div class="field">
      <input type="text" id="auth-user" placeholder="Usuário" autocomplete="username" autocapitalize="characters" required>
    </div>
    <div class="field input-group">
      <input type="password" id="auth-pass" placeholder="Senha" autocomplete="current-password" required>
      <button type="button" class="icon-btn" data-toggle-pass="auth-pass" aria-label="Mostrar senha"><svg class="i"><use href="#i-eye"/></svg></button>
    </div>
    <label class="check" style="margin:4px 0 18px"><input type="checkbox" id="auth-remember"> Manter conectado por 30 dias</label>
    <button class="btn primary lg block" type="submit">Entrar</button>
    <div class="auth-err" id="auth-err"></div>
  </form>
</div>

<!-- ═══════════ APP ═══════════ -->
<div class="app hidden" id="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo"><svg class="i"><use href="#i-logo"/></svg></div>
      <div><b>Fin</b><small id="brand-user">Controle financeiro</small></div>
    </div>
    <button class="btn primary block" data-action="new-tx"><svg class="i"><use href="#i-plus"/></svg> Nova transação <span class="kbd" style="background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.25)">N</span></button>
    <nav class="nav" id="side-nav"></nav>
    <div class="sidebar-foot">
      <span class="sync-dot" id="sync-dot-side" title="Sincronização"></span>
      <small class="muted" id="sync-label" style="flex:1">Conectando…</small>
      <button class="icon-btn sm" data-action="toggle-theme" title="Alternar tema"><svg class="i"><use href="#i-moon"/></svg></button>
      <button class="icon-btn sm" data-action="logout" title="Sair"><svg class="i"><use href="#i-logout"/></svg></button>
    </div>
  </aside>

  <header class="topbar" id="topbar">
    <h2 id="view-title">Início</h2>
    <span class="sync-dot only-mobile" id="sync-dot" title="Sincronização"></span>
    <button class="icon-btn" data-action="toggle-privacy" title="Ocultar/mostrar valores"><svg class="i" id="privacy-ic"><use href="#i-eye"/></svg></button>
    <button class="icon-btn only-desktop" data-action="toggle-theme" title="Alternar tema"><svg class="i"><use href="#i-moon"/></svg></button>
    <button class="icon-btn only-mobile" data-go="settings" title="Ajustes"><svg class="i"><use href="#i-settings"/></svg></button>
  </header>
  <div class="offline-banner hidden" id="offline-banner">Sem internet — suas alterações serão sincronizadas quando voltar.</div>

  <main class="main" id="main">
    <section class="view" id="v-home"></section>
    <section class="view" id="v-tx"></section>
    <section class="view" id="v-bills"></section>
    <section class="view" id="v-budget"></section>
    <section class="view" id="v-invest"></section>
    <section class="view" id="v-goals"></section>
    <section class="view" id="v-receipts"></section>
    <section class="view" id="v-notes"></section>
    <section class="view" id="v-vault"></section>
    <section class="view" id="v-tools"></section>
    <section class="view" id="v-settings"></section>
  </main>

  <nav class="bottombar" id="bottombar">
    <button class="bb-item" data-go="home"><svg class="i"><use href="#i-home"/></svg>Início</button>
    <button class="bb-item" data-go="tx"><svg class="i"><use href="#i-list"/></svg>Extrato</button>
    <button class="bb-fab" data-action="new-tx" aria-label="Nova transação"><svg class="i"><use href="#i-plus"/></svg></button>
    <button class="bb-item" data-go="bills"><svg class="i"><use href="#i-calendar"/></svg>Agenda</button>
    <button class="bb-item" data-action="more"><svg class="i"><use href="#i-grid"/></svg>Mais</button>
  </nav>
</div>

<dialog class="sheet" id="sheet"></dialog>
<dialog class="sheet confirm" id="confirm"></dialog>
<div id="toasts" aria-live="polite"></div>
